services:
  todesursachen-dash:
    build: .
    container_name: todesursachen-dash
    restart: unless-stopped
    env_file: .env
    volumes:
      # Daten als read-only Volume - update der Excels ohne rebuild moeglich
      - ./data:/app/data:ro
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
    networks:
      - proxy

networks:
  proxy:
    name: web-proxy
    external: true
